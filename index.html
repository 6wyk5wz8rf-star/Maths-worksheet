<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f4b86">
    <meta name="description" content="Turn copied mathematics questions into calm, accurate, printable pupil worksheets.">
    <title>Maths Page Studio</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to worksheet</a>

    <header class="app-header" data-screen-only>
      <div class="brand" aria-label="Maths Page Studio">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand-copy">
          <strong>Maths Page Studio</strong>
          <small>Questions into pages</small>
        </span>
      </div>

      <nav class="stage-nav" aria-label="Worksheet stages">
        <button type="button" class="stage-step" data-stage-target="paste"><span>1</span>Paste</button>
        <button type="button" class="stage-step" data-stage-target="check"><span>2</span>Check</button>
        <button type="button" class="stage-step" data-stage-target="make"><span>3</span>Compose</button>
        <button type="button" class="stage-step" data-stage-target="print"><span>4</span>Print</button>
      </nav>

      <div class="header-actions">
        <button type="button" class="icon-button" id="project-library-button" aria-label="Open saved worksheets" title="Saved worksheets">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v15H6.5A2.5 2.5 0 0 1 4 16.5v-10Z"/><path d="M4 16.5A2.5 2.5 0 0 1 6.5 14H20M8 8h8"/></svg>
          <span class="button-label">My sheets</span>
        </button>
        <button type="button" class="icon-button" id="undo-button" aria-label="Undo" title="Undo" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 8-5 4 5 4"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
        </button>
        <button type="button" class="icon-button" id="redo-button" aria-label="Redo" title="Redo" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 8 5 4-5 4"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg>
        </button>
        <button type="button" class="primary compact" id="header-print-button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
          <span>Print</span>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog id="confirm-dialog" class="modal confirm-modal">
      <form method="dialog">
        <span class="modal-symbol" aria-hidden="true">?</span>
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-message"></p>
        <div class="modal-actions">
          <button value="cancel" class="secondary">Keep it</button>
          <button value="confirm" class="danger" id="confirm-action">Remove</button>
        </div>
      </form>
    </dialog>

    <dialog id="project-dialog" class="modal project-modal">
      <form method="dialog">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">On this device</span>
            <h2>Your worksheets</h2>
          </div>
          <button value="cancel" class="close-button" aria-label="Close saved worksheets">×</button>
        </div>
        <div id="project-list" class="project-list"></div>
        <button type="button" id="new-project-button" class="secondary full-width">
          <span aria-hidden="true">＋</span> Start a new worksheet
        </button>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="modal settings-modal">
      <form method="dialog">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">Whole sheet</span>
            <h2>Page settings</h2>
          </div>
          <button value="cancel" class="close-button" aria-label="Close page settings">×</button>
        </div>
        <div id="settings-content"></div>
      </form>
    </dialog>

    <dialog id="versions-dialog" class="modal versions-modal">
      <form method="dialog">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">One worksheet, purposeful versions</span>
            <h2>Versions</h2>
          </div>
          <button value="cancel" class="close-button" aria-label="Close worksheet versions">×</button>
        </div>
        <div id="versions-content"></div>
      </form>
    </dialog>

    <!-- Release-address the entry module so an installed browser does not keep
         an older app graph while the service worker is updating. -->
    <script type="module" src="./js/app.js?v=build3-v3"></script>
  </body>
</html>
