<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f4b86">
    <meta name="description" content="Turn copied mathematics questions into calm, accurate, printable pupil worksheets.">
    <title>Maths Page Studio</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/styles.css?v=release-v5">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to worksheet</a>

    <header class="app-header" data-screen-only>
      <div class="brand" aria-label="Maths Page Studio">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand-copy">
          <strong>Maths Page Studio</strong>
          <small>Questions into pages</small>
        </span>
      </div>

      <div class="header-context" id="header-context" aria-live="polite">Paste questions</div>

      <div class="header-actions">
        <details class="header-menu">
          <summary class="icon-button" aria-label="Open worksheet menu" title="Worksheet menu">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </summary>
          <div class="header-menu-panel">
            <button type="button" id="project-library-button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v15H6.5A2.5 2.5 0 0 1 4 16.5v-10Z"/><path d="M4 16.5A2.5 2.5 0 0 1 6.5 14H20M8 8h8"/></svg>
              My worksheets
            </button>
            <button type="button" id="undo-button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 8-5 4 5 4"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg>
              Undo
            </button>
            <button type="button" id="redo-button" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 8 5 4-5 4"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg>
              Redo
            </button>
            <button type="button" data-action="open-settings">Page setup</button>
            <button type="button" data-action="open-versions">Adaptations</button>
          </div>
        </details>
        <button type="button" class="primary compact" id="header-print-button" aria-label="Print worksheet">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
          <span>Print</span>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog id="confirm-dialog" class="modal confirm-modal" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog">
        <span class="modal-symbol" aria-hidden="true">?</span>
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-message"></p>
        <div class="modal-actions">
          <button value="cancel" class="secondary">Keep it</button>
          <button value="confirm" class="danger" id="confirm-action">Remove</button>
        </div>
      </form>
    </dialog>

    <dialog id="project-dialog" class="modal project-modal" aria-modal="true" aria-labelledby="project-dialog-title">
      <form method="dialog">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">On this device</span>
            <h2 id="project-dialog-title">Your worksheets</h2>
          </div>
          <button value="cancel" class="close-button" aria-label="Close saved worksheets">×</button>
        </div>
        <div id="project-list" class="project-list"></div>
        <button type="button" id="new-project-button" class="secondary full-width">
          <span aria-hidden="true">＋</span> Start a new worksheet
        </button>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="modal settings-modal" aria-modal="true" aria-labelledby="settings-dialog-title">
      <form method="dialog">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">Whole sheet</span>
            <h2 id="settings-dialog-title">Page settings</h2>
          </div>
          <button value="cancel" class="close-button" aria-label="Close page settings">×</button>
        </div>
        <div id="settings-content"></div>
      </form>
    </dialog>

    <dialog id="versions-dialog" class="modal versions-modal" aria-modal="true" aria-labelledby="versions-dialog-title">
      <form method="dialog">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">Only when pupils need a different route</span>
            <h2 id="versions-dialog-title">Adaptations</h2>
          </div>
          <button value="cancel" class="close-button" aria-label="Close adaptations">×</button>
        </div>
        <div id="versions-content"></div>
      </form>
    </dialog>

    <!-- Release-address the entry module so an installed browser does not keep
         an older app graph while the service worker is updating. -->
    <script type="module" src="./js/app.js?v=release-v5"></script>
  </body>
</html>
